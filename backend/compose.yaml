services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events_dev_password
      POSTGRES_DB: community_events
    volumes:
      - events_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events -d community_events"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  events_data:
